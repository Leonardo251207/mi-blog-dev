sites:
  - slug: demo
    name: Demo local
    type: laboratorio
    timezone: UTC
    retention_events_days: 90
    retention_aggregates_months: 25
    tags:
      - demo
    domains:
      - host: localhost:8000
        type: temporal
        environment: local
        canonical: true
      - host: 127.0.0.1:8000
        type: temporal
        environment: local
        canonical: false
    channels:
      - type: beacon
        origin_mode: exact
        origins:
          - http://localhost:8000
          - http://127.0.0.1:8000
        environments:
          - local
        key_ref: env:DEV_BEACON_KEY
