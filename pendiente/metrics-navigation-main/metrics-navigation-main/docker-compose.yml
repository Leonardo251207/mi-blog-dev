version: "3.8"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-metrics}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-metrics}

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_MODE=minimal
      - APP_PORT=8000
      - STORAGE=mongo
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=metrics
      - ADMIN_API_KEY=${ADMIN_API_KEY:-prod-admin-key-change-me-2026}
      - IP_HASH_SALT=${IP_HASH_SALT:-prod-salt-change-me-2026}
      - DEV_BEACON_KEY=${DEV_BEACON_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://tusitio.com}
      - BOOTSTRAP_FILE=config/bootstrap.yaml
      - BOOTSTRAP_ON_START=true
      - BEACON_RATE_LIMIT_PER_MINUTE=600
    volumes:
      - ./config:/app/config:ro
      - ./.env:/app/.env:ro
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
